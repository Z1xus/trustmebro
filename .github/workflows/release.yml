name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel,   target: macos-x86_64 }
          - { os: macos-latest,     target: macos-arm64 }
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          make LDFLAGS="-static -Wl,--gc-sections -s" || make
          ./trustmebro version
      - name: Package
        run: tar -czf trustmebro-${{ matrix.target }}.tar.gz trustmebro
      - uses: actions/upload-artifact@v4
        with:
          name: trustmebro-${{ matrix.target }}
          path: trustmebro-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
